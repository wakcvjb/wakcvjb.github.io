<body>
    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js">
    </script>
    <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js">
    </script>

    <script>
        const { createRoot } = ReactDOM;
        const { useState, useRef, useEffect, useCallback } = React;

        const BG_IMAGE_1 = 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=1600&q=80';
        const BG_IMAGE_2 = 'https://images.unsplash.com/photo-1519681393784-d120267933ba?w=1600&q=80';
        const SPOTLIGHT_R = 260;

        const ImageWithOverlay = ({ src, className, style, children }) => {
            const [imgError, setImgError] = useState(false);
            return React.createElement(
                'div',
                {
                    className: `relative overflow-hidden ${className || ''}`,
                    style: {
                        backgroundImage: imgError ? 'none' : `url(${src})`,
                        backgroundSize: 'cover',
                        backgroundPosition: 'center',
                        backgroundRepeat: 'no-repeat',
                        backgroundColor: '#000',
                        ...(style || {}),
                    },
                },
                React.createElement('div', {
                    className: 'absolute inset-0 overlay-mask',
                    style: { zIndex: 1 },
                }),
                children,
                React.createElement('img', {
                    src: src,
                    alt: '',
                    style: { display: 'none' },
                    onError: () => setImgError(true),
                })
            );
        };

        const RevealLayer = ({ image, cursorX, cursorY }) => {
            const canvasRef = useRef(null);
            const revealRef = useRef(null);

            const resizeCanvas = useCallback(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }, []);

            useEffect(() => {
                resizeCanvas();
                window.addEventListener('resize', resizeCanvas);
                return () => window.removeEventListener('resize', resizeCanvas);
            }, [resizeCanvas]);

            useEffect(() => {
                const canvas = canvasRef.current;
                const revealDiv = revealRef.current;
                if (!canvas || !revealDiv) return;
                const ctx = canvas.getContext('2d');
                if (!ctx) return;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const grad = ctx.createRadialGradient(cursorX, cursorY, 0, cursorX, cursorY, SPOTLIGHT_R);
                grad.addColorStop(0, 'rgba(255,255,255,1)');
                grad.addColorStop(0.4, 'rgba(255,255,255,1)');
                grad.addColorStop(0.6, 'rgba(255,255,255,0.75)');
                grad.addColorStop(0.75, 'rgba(255,255,255,0.4)');
                grad.addColorStop(0.88, 'rgba(255,255,255,0.12)');
                grad.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(cursorX, cursorY, SPOTLIGHT_R, 0, Math.PI * 2);
                ctx.fill();
                const dataUrl = canvas.toDataURL();
                revealDiv.style.maskImage = `url(${dataUrl})`;
                revealDiv.style.webkitMaskImage = `url(${dataUrl})`;
            }, [cursorX, cursorY]);

            return React.createElement(
                React.Fragment,
                null,
                React.createElement('canvas', {
                    ref: canvasRef,
                    style: { display: 'none', position: 'absolute', inset: 0, pointerEvents: 'none' },
                }),
                React.createElement('div', {
                    ref: revealRef,
                    className: 'absolute inset-0 z-30 pointer-events-none',
                    style: {
                        maskSize: '100% 100%',
                        WebkitMaskSize: '100% 100%',
                        backgroundImage: `url(${image})`,
                        backgroundSize: 'cover',
                        backgroundPosition: 'center',
                        backgroundRepeat: 'no-repeat',
                        backgroundColor: '#000',
                    },
                },
                    React.createElement('div', {
                        className: 'absolute inset-0 overlay-mask',
                        style: { zIndex: 1 },
                    })
                )
            );
        };

        const MenuIcon = () =>

                    ),
                    React.createElement(
                        'a',
                        {
                            href: 'https://github.com/wakcvjb/ai',
                            target: '_blank',
                            rel: 'noopener noreferrer',
                            className: 'inline-block bg-accent text-white text-sm font-medium px-7 py-3 hover:bg-black transition-colors',
                            style: { border: 'none' },
                        },
                        '开始探索'
                    )

        };

        const ModelPage = () =>
            React.createElement(
                'section',
                { className: 'min-h-screen bg-white pt-24 pb-16 px-5 md:px-16' },
                React.createElement('h2', { className: 'text-4xl md:text-5xl font-bold mb-10' }, '模型架构'),

                    'div',
                    { className: 'max-w-3xl flex flex-col gap-6 text-lg leading-relaxed text-gray-800' },

                    React.createElement('p', null, '模型的核心参数为：嵌入维度 768，注意力头数 12，总参数量 1.62 亿（162M）。这个规模介于 GPT-2 Small（1.24 亿）和 GPT-2 Medium（3.5 亿）之间，属于轻量级语言模型，适合在消费级 GPU 上运行。'),
                    React.createElement('p', null, '模型采用 AdamW 优化器进行训练，学习率为 0.0002，使用交叉熵损失函数。训练过程中使用了混合精度（Autocast）和梯度缩放（GradScaler）来加速计算并节省显存。'),
                    React.createElement(
                        'div',
                        { className: 'grid grid-cols-1 sm:grid-cols-3 gap-4 mt-4' },
                        React.createElement(
                            'div',
                            { className: 'border border-black/10 p-4' },
                            React.createElement('div', { className: 'text-sm text-gray-500' }, '嵌入层'),
                            React.createElement('div', { className: 'text-2xl font-bold mt-1' }, '39.6M')
                        ),
                        React.createElement(
                            'div',
                            { className: 'border border-black/10 p-4' },
                            React.createElement('div', { className: 'text-sm text-gray-500' }, 'Transformer层'),
                            React.createElement('div', { className: 'text-2xl font-bold mt-1' }, '113.3M')
                        ),
                        React.createElement(
                            'div',
                            { className: 'border border-black/10 p-4' },
                            React.createElement('div', { className: 'text-sm text-gray-500' }, '输出层'),
                            React.createElement('div', { className: 'text-2xl font-bold mt-1' }, '9.1M')
                        )

        const TrainingPage = () =>
            React.createElement(
                'section',
                { className: 'min-h-screen bg-white pt-24 pb-16 px-5 md:px-16' },
                React.createElement('h2', { className: 'text-4xl md:text-5xl font-bold mb-10' }, '训练历程'),
                React.createElement(
                    'div',
                    { className: 'max-w-3xl flex flex-col gap-6 text-lg leading-relaxed text-gray-800' },
                    React.createElement('p', null, 'KMilo 的训练数据来自 Daily Dialogue 数据集，包含 75,500 条英文日常对话。每条对话均经过清洗和格式化，添加了 eou（End of Utterance）标记以区分不同说话人。'),
                    React.createElement('p', null, '模型在 Kaggle 平台上使用 TPU v5e-8 完成训练。TPU v5e-8 配备 8 个 TPU v5e 核心，提供高效的大规模矩阵运算能力，尤其适合 Transformer 模型的训练。'),
                    React.createElement('p', null, '训练配置：batch size 为 8，上下文长度（Sequence Length）为 256 token。经过 5,000 步训练，Loss 从初始的 10.98 迅速下降至 0.2-0.6 区间并保持稳定，表明模型已成功学习英文对话的语法与语义模式。'),

                                ' 5,000 steps'

                        ),

                        React.createElement('p', { className: 'text-base text-gray-800 leading-relaxed' }, 'KMilo 由独立开发者 wakcvjb 从零开始构建。整个项目完全是个人兴趣驱动的实验，没有团队，没有投资，只有对 AI 技术的热爱和一只一直陪伴开发过程的猫。如果这个轻量级模型对你有所帮助，欢迎通过爱发电支持独立开发者的工作，让小猫也能吃上更好的罐头。')
                    )
                )
            );

        const App = () => {
            const [activePage, setActivePage] = useState('home');
            const [cursorPos, setCursorPos] = useState({ x: -999, y: -999 });
            const mouseRef = useRef({ x: -999, y: -999 });
            const smoothRef = useRef({ x: -999, y: -999 });
            const rafRef = useRef(null);

            useEffect(() => {
                const handleMouseMove = (e) => {
                    mouseRef.current.x = e.clientX;
                    mouseRef.current.y = e.clientY;
                };
                window.addEventListener('mousemove', handleMouseMove, { passive: true });
                return () => window.removeEventListener('mousemove', handleMouseMove);
            }, []);

            useEffect(() => {
                const loop = () => {
                    const mouse = mouseRef.current;
                    const smooth = smoothRef.current;
                    smooth.x += (mouse.x - smooth.x) * 0.1;
                    smooth.y += (mouse.y - smooth.y) * 0.1;
                    setCursorPos({ x: smooth.x, y: smooth.y });
                    rafRef.current = requestAnimationFrame(loop);
                };
                rafRef.current = requestAnimationFrame(loop);
                return () => {
                    if (rafRef.current) cancelAnimationFrame(rafRef.current);
                };
            }, []);

            const renderPage = () => {
                switch (activePage) {
                    case 'model':
                        return React.createElement(ModelPage);
                    case 'training':
                        return React.createElement(TrainingPage);
                    case 'download':
                        return React.createElement(DownloadPage);
                    case 'demo':
                        return React.createElement(DemoPage);
                    case 'sponsor':
                        return React.createElement(SponsorPage);
                    default:
                        return React.createElement(HomePage, { cursorPos });
                }
            };

            return React.createElement(
                'div',
                { className: 'min-h-screen bg-white text-black' },
                React.createElement(Nav, {
                    activePage,
                    onPageChange: setActivePage,
                }),
                renderPage(),
                React.createElement(Footer)
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
    </script>
