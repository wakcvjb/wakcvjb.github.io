<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniDialogue</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #ffffff;
            color: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            max-width: 640px;
            padding: 40px 24px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 48px;
            font-weight: 700;
            margin: 0 0 12px 0;
            letter-spacing: -1px;
        }

        .subtitle {
            font-size: 20px;
            color: #555;
            margin: 0 0 32px 0;
            line-height: 1.4;
        }

        .desc {
            font-size: 16px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 40px;
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
        }

        .download-btn {
            display: inline-block;
            background-color: #1a1a1a;
            color: #ffffff;
            padding: 16px 40px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 8px;
            text-decoration: none;
            transition: background-color 0.2s ease;
        }

        .download-btn:hover {
            background-color: #333;
        }

        .badge {
            margin-top: 20px;
            font-size: 14px;
            color: #888;
        }

        .badge a {
            color: #1a1a1a;
            text-decoration: underline;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            z-index: 999;
        }

        .overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .modal {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            padding: 32px 28px 40px;
            border-radius: 20px 20px 0 0;
            box-shadow: 0 -8px 30px rgba(0,0,0,0.08);
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-sizing: border-box;
        }

        .overlay.active .modal {
            transform: translateY(0);
        }

        .modal h2 {
            font-size: 22px;
            margin: 0 0 12px 0;
        }

        .modal p {
            font-size: 15px;
            color: #555;
            line-height: 1.6;
            margin: 0 0 24px 0;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
        }

        .modal-actions button {
            flex: 1;
            padding: 12px 0;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn-agree {
            background-color: #1a1a1a;
            color: #fff;
        }

        .btn-agree:hover {
            background-color: #333;
        }

        .btn-decline {
            background-color: #f0f0f0;
            color: #333;
        }

        .btn-decline:hover {
            background-color: #e0e0e0;
        }

        @media (max-width: 480px) {
            h1 { font-size: 36px; }
            .subtitle { font-size: 18px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>MiniDialogue</h1>
        <div class="subtitle">轻量手机端 AI</div>
        <div class="desc">
            基于 TinyTransformer 架构，仅需 1MB 左右权重即可在手机 CPU 上运行。<br>
            无需网络，纯本地推理。
        </div>
        
        <a href="#" id="downloadTrigger" class="download-btn">下载模型</a>
        
        <div class="badge">
            开源协议 <a href="https://github.com/wakcvjb/ai" target="_blank">GitHub 仓库</a>
        </div>
    </div>

    <div class="overlay" id="overlay">
        <div class="modal">
            <h2>使用协议</h2>
            <p>
                MiniDialogue 遵循 MIT 协议。<br>
                可自由下载、使用及修改本模型，但需保留版权声明。<br>
                使用本模型产生的任何后果，开发者不承担法律责任。
            </p>
            <div class="modal-actions">
                <button class="btn-decline" id="btnDecline">拒绝</button>
                <button class="btn-agree" id="btnAgree">同意并下载</button>
            </div>
        </div>
    </div>

    <script>
        const overlay = document.getElementById('overlay');
        const trigger = document.getElementById('downloadTrigger');
        const btnAgree = document.getElementById('btnAgree');
        const btnDecline = document.getElementById('btnDecline');

        trigger.addEventListener('click', function(e) {
            e.preventDefault();
            overlay.classList.add('active');
        });

        btnAgree.addEventListener('click', function() {
            window.location.href = 'https://github.com/wakcvjb/ai';
        });

        btnDecline.addEventListener('click', function() {
            overlay.classList.remove('active');
        });

        overlay.addEventListener('click', function(e) {
            if (e.target === overlay) {
                overlay.classList.remove('active');
            }
        });
    </script>

</body>
</html>
