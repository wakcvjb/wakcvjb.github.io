<head>
<meta charset="UTF-8">

<title>MiniDialogue — Lightweight Mobile AI</title>
<style>
  :root{
    --blue-1:#0066ff;
    --blue-2:#00ccff;
    --blue-glow: 0 0 20px rgba(0,153,255,.65), 0 0 60px rgba(0,102,255,.35);
    --panel-bg: rgba(8,12,20,0.55);
    --panel-border: rgba(0,153,255,0.35);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    width:100%; height:100%;
    background:#000;
    color:#eaf3ff;
    font-family:"Helvetica Neue", "Segoe UI", "Hiragino Sans", "PingFang SC", "Microsoft YaHei", "Noto Sans KR", sans-serif;
    overflow-x:hidden;
    overflow-y:auto;
  }
  #bg-canvas{
    position:fixed;
    top:0; left:0;
    width:100vw; height:100vh;
    z-index:0;
    display:block;
    background:#000;
  }
  .page{
    position:relative;
    z-index:2;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    opacity:0;
    animation:fadeIn 1.5s ease forwards;
    animation-delay:.2s;
  }
  @keyframes fadeIn{ to{ opacity:1; } }

  /* ---------- NAV ---------- */
  .navbar{
    position:fixed;
    top:0; left:0; right:0;
    z-index:10;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: clamp(14px,2vw,26px) clamp(20px,4vw,60px);
    backdrop-filter: blur(6px);
    background: linear-gradient(to bottom, rgba(0,0,0,0.55), rgba(0,0,0,0));
  }
  .brand{
    font-size: clamp(20px,2.2vw,28px);
    font-weight:700;
    letter-spacing:2px;
    color: rgba(255,255,255,0.85);
    cursor:pointer;
    text-shadow: var(--blue-glow);
    user-select:none;
    transition: color .25s ease, transform .15s ease;
  }
  .brand:hover{ color:#fff; transform:scale(1.05); }
  .nav-right{
    display:flex;
    align-items:center;
    gap: clamp(14px, 2vw, 34px);
  }
  .nav-link{
    font-size: clamp(13px,1vw,16px);
    color: rgba(255,255,255,0.55);
    text-decoration:none;
    letter-spacing:1px;
    cursor:pointer;
    transition: color .25s ease;
    white-space:nowrap;
  }
  .nav-link:hover{ color:#fff; }
  .lang-switch{
    border: 1px solid rgba(255,255,255,0.3);
    color: rgba(255,255,255,0.7);
    background: rgba(255,255,255,0.05);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: clamp(12px,0.9vw,14px);
    cursor:pointer;
    letter-spacing:1px;
    transition: all .25s ease;
    user-select:none;
  }
  .lang-switch:hover{
    color:#fff;
    border-color: var(--blue-2);
    box-shadow: 0 0 12px rgba(0,153,255,0.4);
  }

  /* ---------- HERO ---------- */
  .hero{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 120px 20px 60px;
    min-height:100vh;
  }
  .hero h1{
    font-size: clamp(42px, 8vw, 96px);
    font-weight:800;
    letter-spacing: 3px;
    color:#fff;
    text-shadow:
      0 0 10px rgba(0,204,255,0.8),
      0 0 30px rgba(0,153,255,0.6),
      0 0 70px rgba(0,102,255,0.4);
    margin-bottom: clamp(10px,1.5vw,18px);
  }
  .hero .subtitle{
    font-size: clamp(16px, 2vw, 24px);
    color: rgba(200,225,255,0.9);
    letter-spacing:1px;
    margin-bottom: clamp(10px,1.2vw,16px);
    font-weight:300;
  }
  .hero .description{
    font-size: clamp(13px, 1.1vw, 16px);
    color: rgba(170,195,220,0.75);
    max-width: 720px;
    line-height:1.8;
    margin-bottom: clamp(28px,3vw,44px);
    letter-spacing:0.3px;
  }
  .btn-download{
    position:relative;
    padding: 16px 46px;
    font-size: clamp(14px,1.1vw,17px);
    font-weight:600;
    letter-spacing:1.5px;
    color:#fff;
    background: linear-gradient(135deg, var(--blue-1), var(--blue-2));
    border:none;
    border-radius: 40px;
    cursor:pointer;
    box-shadow: 0 0 20px rgba(0,153,255,0.45);
    transition: transform .15s ease, box-shadow .3s ease;
  }
  .btn-download:hover{
    box-shadow: 0 0 40px rgba(0,204,255,0.85), 0 0 80px rgba(0,102,255,0.5);
    transform: translateY(-2px);
  }
  .btn-download:active{
    transform: scale(0.94);
  }

  /* ---------- PLANS ---------- */
  .plans{
    position:relative;
    z-index:2;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap: clamp(16px,2vw,28px);
    padding: 20px clamp(20px,5vw,80px) 100px;
  }
  .plan-card{
    width: min(320px, 86vw);
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    padding: 28px 26px;
    backdrop-filter: blur(10px);
    transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
  }
  .plan-card:hover{
    transform: translateY(-6px);
    border-color: rgba(0,204,255,0.8);
    box-shadow: 0 10px 40px rgba(0,102,255,0.25);
  }
  .plan-card h3{
    font-size: clamp(17px,1.3vw,20px);
    color:#fff;
    margin-bottom:12px;
    letter-spacing:0.5px;
    text-shadow: 0 0 12px rgba(0,153,255,0.5);
  }
  .plan-card p{
    font-size: clamp(13px,1vw,14.5px);
    color: rgba(180,205,230,0.75);
    line-height:1.7;
  }

  /* ---------- FOOTER ---------- */
  footer{
    position:relative;
    z-index:2;
    display:flex;
    justify-content:center;
    gap: clamp(24px,4vw,60px);
    padding: 24px 20px 40px;
    flex-wrap:wrap;
  }
  .footer-link{
    font-size: clamp(12px,0.95vw,14px);
    color: rgba(255,255,255,0.45);
    cursor:pointer;
    text-decoration:none;
    letter-spacing:1px;
    transition: color .25s ease;
  }
  .footer-link:hover{ color:#fff; text-shadow: 0 0 10px rgba(0,153,255,0.7); }

  /* ---------- MODALS ---------- */
  .modal-overlay{
    position:fixed;
    inset:0;
    z-index:100;
    background: rgba(0,4,10,0.72);
    backdrop-filter: blur(8px);
    display:none;
    align-items:center;
    justify-content:center;
    padding: 20px;
  }
  .modal-overlay.active{ display:flex; }
  .modal-box{
    width: min(560px, 92vw);
    max-height: 82vh;
    overflow-y:auto;
    background: linear-gradient(160deg, rgba(10,16,28,0.95), rgba(4,8,16,0.95));
    border: 1px solid rgba(0,153,255,0.4);
    border-radius: 18px;
    padding: clamp(24px,4vw,38px);
    box-shadow: 0 0 60px rgba(0,102,255,0.25);
    animation: modalIn .3s ease;
  }
  @keyframes modalIn{
    from{ opacity:0; transform: scale(0.92) translateY(10px); }
    to{ opacity:1; transform: scale(1) translateY(0); }
  }
  .modal-box h2{
    font-size: clamp(19px,2vw,24px);
    color:#fff;
    margin-bottom:16px;
    text-shadow: 0 0 14px rgba(0,153,255,0.6);
    letter-spacing:0.5px;
  }
  .modal-box p{
    font-size: clamp(13px,1vw,14.5px);
    color: rgba(190,212,235,0.85);
    line-height:1.85;
    margin-bottom: 24px;
    white-space:pre-line;
  }
  .modal-actions{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    justify-content:flex-end;
  }
  .modal-btn{
    padding: 11px 26px;
    font-size: 13.5px;
    font-weight:600;
    letter-spacing:0.5px;
    border-radius: 30px;
    border:1px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.8);
    cursor:pointer;
    transition: all .2s ease;
  }
  .modal-btn:hover{
    border-color: rgba(255,255,255,0.5);
    color:#fff;
  }
  .modal-btn.primary{
    background: linear-gradient(135deg, var(--blue-1), var(--blue-2));
    border:none;
    color:#fff;
    box-shadow: 0 0 18px rgba(0,153,255,0.45);
  }
  .modal-btn.primary:hover{
    box-shadow: 0 0 30px rgba(0,204,255,0.8);
  }
  .easter-cat{
    font-size: 90px;
    text-align:center;
    margin-bottom: 18px;
    filter: drop-shadow(0 0 20px rgba(0,153,255,0.5));
  }

  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background: rgba(0,153,255,0.4); border-radius:4px; }

  @media (max-width: 600px){
    .nav-right{ gap:10px; }
    .nav-link{ display:none; }
    .plans{ padding-bottom:70px; }
  }
</style>

  <!-- PLANS -->
  <section class="plans" id="roadmap">
    <div class="plan-card">

    </div>
    <div class="plan-card">

      <p data-i18n="plan2Desc"></p>
    </div>
    <div class="plan-card">

    </div>
  </section>

  <!-- FOOTER -->

    <span class="footer-link" id="sponsorLink" data-i18n="footerSponsor"></span>
    <a class="footer-link" id="githubLink" data-i18n="footerGitHub" href="#" target="_blank" rel="noopener"></a>
  </footer>
</div>

<!-- LICENSE MODAL -->
<div class="modal-overlay" id="licenseModal">
  <div class="modal-box">
    <h2 data-i18n="licenseTitle"></h2>

    <div class="modal-actions">

      <button class="modal-btn primary" id="licenseAgreeBtn" data-i18n="licenseAgree"></button>
    </div>
  </div>
</div>

<!-- SPONSOR MODAL -->
<div class="modal-overlay" id="sponsorModal">
  <div class="modal-box">
    <h2 data-i18n="sponsorTitle"></h2>
    <p data-i18n="sponsorContent"></p>
    <div class="modal-actions">
      <button class="modal-btn" id="sponsorCloseBtn" data-i18n="sponsorClose"></button>
      <button class="modal-btn primary" id="sponsorGoBtn" data-i18n="sponsorButton"></button>
    </div>
  </div>
</div>

<!-- EASTER EGG MODAL -->
<div class="modal-overlay" id="easterModal">
  <div class="modal-box">
    <div class="easter-cat">🐱</div>
    <h2 data-i18n="easterTitle"></h2>
    <p data-i18n="easterContent"></p>

      <button class="modal-btn primary" id="easterSponsorBtn" data-i18n="easterSponsorButton"></button>
    </div>
  </div>
</div>

let currentLang = localStorage.getItem("md_lang") || "en";

function applyTranslations(){
  const dict = translations[currentLang];
  document.documentElement.lang = currentLang;
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    if (dict[key] !== undefined) el.textContent = dict[key];
  });
  document.getElementById("langSwitch").textContent = langLabels[currentLang];
  document.getElementById("feedbackLink").href = dict.feedbackMailto;
  document.getElementById("githubLink").href = dict.githubUrl;
  document.title = dict.siteTitle + " — " + dict.siteSubtitle;
}

document.getElementById("langSwitch").addEventListener("click", () => {
  const idx = langOrder.indexOf(currentLang);
  currentLang = langOrder[(idx + 1) % langOrder.length];
  localStorage.setItem("md_lang", currentLang);
  applyTranslations();
});

applyTranslations();

/* =========================================================================
   THREE.JS PARTICLE SYSTEM — BLUE "M" FORMATION
   ========================================================================= */
(function(){
  const canvas = document.getElementById("bg-canvas");

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 2000);
  camera.position.set(0, 0, 260);

  const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x000000, 1);

  // ---- Particle count auto-scales by screen width ----
  function getParticleCount(){
    const w = window.innerWidth;
    if (w <= 480) return 2200;
    if (w <= 900) return 4500;
    if (w <= 1440) return 7500;
    return 10000;
  }
  let PARTICLE_COUNT = getParticleCount();

  // ---- Canvas-generated circular gradient texture for particles ----
  function createParticleTexture(){
    const size = 128;
    const cnv = document.createElement("canvas");
    cnv.width = size; cnv.height = size;
    const ctx = cnv.getContext("2d");
    const gradient = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
    gradient.addColorStop(0, "rgba(255,255,255,1)");
    gradient.addColorStop(0.2, "rgba(210,240,255,0.95)");
    gradient.addColorStop(0.5, "rgba(0,204,255,0.55)");
    gradient.addColorStop(1, "rgba(0,102,255,0)");
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, size, size);
    const tex = new THREE.CanvasTexture(cnv);
    tex.needsUpdate = true;
    return tex;
  }
  const particleTexture = createParticleTexture();

  // ---- Build "M" shape target point cloud (centerline stroke sampling) ----
  // Letter M defined via 4 centerline segments in normalized space [-1,1]
  const mSegments = [
    [[-1, -1], [-1, 1]],      // left vertical stroke
    [[-1, 1], [0, -0.25]],    // diagonal down to valley
    [[0, -0.25], [1, 1]],     // diagonal up to right peak
    [[1, 1], [1, -1]]         // right vertical stroke
  ];
  // compute segment lengths for proportional sampling
  const segLengths = mSegments.map(([a,b]) => Math.hypot(b[0]-a[0], b[1]-a[1]));
  const totalLen = segLengths.reduce((s,l)=>s+l, 0);

  const SCALE = 78;      // world-space scale of the M shape
  const THICKNESS = 0.16; // stroke half-thickness in normalized units

  function sampleMPoint(){
    // pick a segment weighted by its length
    let r = Math.random() * totalLen;
    let segIdx = 0;
    for (let i = 0; i < segLengths.length; i++){
      if (r <= segLengths[i]){ segIdx = i; break; }
      r -= segLengths[i];
    }
    const [a, b] = mSegments[segIdx];
    const t = Math.random();
    const px = a[0] + (b[0]-a[0]) * t;
    const py = a[1] + (b[1]-a[1]) * t;
    // perpendicular direction for thickness jitter
    const dx = b[0]-a[0], dy = b[1]-a[1];
    const len = Math.hypot(dx, dy) || 1;
    const nx = -dy/len, ny = dx/len;
    const offset = (Math.random()*2 - 1) * THICKNESS;
    const fx = (px + nx*offset) * SCALE;
    const fy = (py + ny*offset) * SCALE;
    const fz = (Math.random()*2 - 1) * 14; // depth jitter for volumetric feel
    return [fx, fy, fz];
  }

  // ---- Allocate buffers ----
  const positions = new Float32Array(PARTICLE_COUNT * 3);   // current render position
  const startPositions = new Float32Array(PARTICLE_COUNT * 3); // scattered origin
  const targetPositions = new Float32Array(PARTICLE_COUNT * 3); // M-shape target
  const colors = new Float32Array(PARTICLE_COUNT * 3);
  const sizes = new Float32Array(PARTICLE_COUNT);
  const randomPhase = new Float32Array(PARTICLE_COUNT); // per-particle phase offset for organic feel

  const colorA = new THREE.Color(0x0066ff);
  const colorB = new THREE.Color(0x00ccff);

  const SCATTER_RANGE_X = 220;
  const SCATTER_RANGE_Y = 140;
  const SCATTER_RANGE_Z = 160;

  for (let i = 0; i < PARTICLE_COUNT; i++){
    const i3 = i * 3;

    // scattered start position
    startPositions[i3]     = (Math.random()*2 - 1) * SCATTER_RANGE_X;
    startPositions[i3 + 1] = (Math.random()*2 - 1) * SCATTER_RANGE_Y;
    startPositions[i3 + 2] = (Math.random()*2 - 1) * SCATTER_RANGE_Z;

    // M-shape target position
    const [mx, my, mz] = sampleMPoint();
    targetPositions[i3]     = mx;
    targetPositions[i3 + 1] = my;
    targetPositions[i3 + 2] = mz;

    // initial render position = start
    positions[i3]     = startPositions[i3];
    positions[i3 + 1] = startPositions[i3 + 1];
    positions[i3 + 2] = startPositions[i3 + 2];

    // color: interpolate between the two blues
    const mixT = Math.random();
    const c = colorA.clone().lerp(colorB, mixT);
    colors[i3] = c.r; colors[i3+1] = c.g; colors[i3+2] = c.b;

    // size range 0.08 - 0.35 (scaled up for world units, refined in shader-less PointsMaterial via size attribute base)
    sizes[i] = 0.08 + Math.random() * (0.35 - 0.08);

    randomPhase[i] = Math.random() * Math.PI * 2;
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));
  geometry.setAttribute("size", new THREE.BufferAttribute(sizes, 1));

  // PointsMaterial scaled for 4K refinement; size in world units via sizeAttenuation
  const material = new THREE.PointsMaterial({
    size: 3.2,
    map: particleTexture,
    vertexColors: true,
    transparent: true,
    opacity: 0.9,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    sizeAttenuation: true
  });

  const particleSystem = new THREE.Points(geometry, material);
  scene.add(particleSystem);

  // Slight ambient point light feel via a soft glow sprite behind (purely additive canvas glow)
  scene.background = null;

  /* ---------- Mouse interaction state ---------- */
  const mouse = new THREE.Vector2(0, 0);       // normalized device coords
  const mouseWorld = new THREE.Vector3(0, 0, 0); // unprojected onto z=0 plane
  let hoverIntensity = 0; // smoothed glow boost when mouse is near shape
  let targetRotX = 0, targetRotY = 0;
  let currentRotX = 0, currentRotY = 0;

  window.addEventListener("mousemove", (e) => {
    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

    // parallax rotation targets
    targetRotY = mouse.x * 0.18;
    targetRotX = mouse.y * 0.12;

    // unproject mouse to the z=0 plane in world space
    const vec = new THREE.Vector3(mouse.x, mouse.y, 0.5);
    vec.unproject(camera);
    const dir = vec.sub(camera.position).normalize();
    const dist = -camera.position.z / dir.z;
    mouseWorld.copy(camera.position).add(dir.multiplyScalar(dist));
  });

  // touch support for mobile parallax
  window.addEventListener("touchmove", (e) => {
    if (e.touches.length > 0){
      const t = e.touches[0];
      mouse.x = (t.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(t.clientY / window.innerHeight) * 2 + 1;
      targetRotY = mouse.x * 0.18;
      targetRotX = mouse.y * 0.12;
    }
  }, { passive: true });

  /* ---------- Animation cycle constants ---------- */
  const CYCLE_DURATION = 8.0;   // seconds per full aggregate/disperse loop
  const BREATHE_PERIOD = 3.0;   // seconds per breathing pulse

  const clock = new THREE.Clock();
  const posAttr = geometry.getAttribute("position");
  const sizeAttr = geometry.getAttribute("size");

  // Smooth easing function (smootherstep)
  function smootherstep(x){
    x = Math.max(0, Math.min(1, x));
    return x*x*x*(x*(x*6 - 15) + 10);
  }

  function animate(){
    requestAnimationFrame(animate);
    const elapsed = clock.getElapsedTime();

    // ---- Cycle phase: 0 -> aggregate -> hold/breathe -> disperse -> 0 ----
    const cycleT = (elapsed % CYCLE_DURATION) / CYCLE_DURATION; // 0..1
    // Build an aggregation factor curve across the cycle:
    // 0.00-0.40 aggregate (scatter -> M), 0.40-0.75 hold & breathe, 0.75-1.00 disperse (M -> scatter)
    let aggFactor;
    if (cycleT < 0.40){
      aggFactor = smootherstep(cycleT / 0.40);
    } else if (cycleT < 0.75){
      aggFactor = 1.0;
    } else {
      aggFactor = smootherstep(1.0 - (cycleT - 0.75) / 0.25);
    }

    // breathing pulse (sine wave, 3s cycle) applied during the "hold" phase primarily,
    // but kept subtle throughout for organic continuity
    const breathe = Math.sin((elapsed / BREATHE_PERIOD) * Math.PI * 2) * 0.5 + 0.5; // 0..1
    const breatheScale = 1.0 + breathe * 0.035 * aggFactor;

    // smooth camera parallax rotation
    currentRotX += (targetRotX - currentRotX) * 0.04;
    currentRotY += (targetRotY - currentRotY) * 0.04;
    particleSystem.rotation.x = currentRotX;
    particleSystem.rotation.y = currentRotY;

    // hover glow intensity smoothing: brighten when mouse is near screen center (over the M)
    const distFromCenter = Math.hypot(mouse.x, mouse.y);
    const nearShape = distFromCenter < 0.6 ? 1 : 0;
    hoverIntensity += (nearShape - hoverIntensity) * 0.05;

    for (let i = 0; i < PARTICLE_COUNT; i++){
      const i3 = i * 3;
      const phase = randomPhase[i];

      // interpolate between scattered start and M-shape target
      const sx = startPositions[i3], sy = startPositions[i3+1], sz = startPositions[i3+2];
      const tx = targetPositions[i3], ty = targetPositions[i3+1], tz = targetPositions[i3+2];

      let px = sx + (tx - sx) * aggFactor;
      let py = sy + (ty - sy) * aggFactor;
      let pz = sz + (tz - sz) * aggFactor;

      // apply breathing scale (expand/contract around origin) once aggregated
      px *= breatheScale;
      py *= breatheScale;

      // subtle organic drift using per-particle phase, stronger while scattered
      const driftAmt = (1 - aggFactor) * 6.0;
      px += Math.sin(elapsed * 0.6 + phase) * driftAmt * 0.3;
      py += Math.cos(elapsed * 0.5 + phase) * driftAmt * 0.3;
      pz += Math.sin(elapsed * 0.4 + phase) * driftAmt * 0.3;

      // ---- mouse repulsion: particles near cursor (world-space proxy) expand outward ----
      const dx = px - mouseWorld.x;
      const dy = py - mouseWorld.y;
      const distToMouse = Math.hypot(dx, dy);
      const repelRadius = 34;
      if (distToMouse < repelRadius && distToMouse > 0.001){
        const force = (1 - distToMouse / repelRadius) * 18 * aggFactor;
        px += (dx / distToMouse) * force;
        py += (dy / distToMouse) * force;
      }

      posAttr.array[i3]     = px;
      posAttr.array[i3 + 1] = py;
      posAttr.array[i3 + 2] = pz;

      // size pulses slightly with breathing + hover glow
      const baseSize = sizes[i];
      sizeAttr.array[i] = baseSize * (1 + breathe * 0.15 * aggFactor) * (1 + hoverIntensity * 0.25);
    }
    posAttr.needsUpdate = true;
    sizeAttr.needsUpdate = true;

    // Overall material glow boost on hover (brighter "M")
    material.opacity = 0.82 + hoverIntensity * 0.18 + breathe * 0.05 * aggFactor;
    material.size = 3.2 + hoverIntensity * 1.1;

    renderer.render(scene, camera);
  }
  animate();

  /* ---------- Responsive resize handling ---------- */
  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    // Note: particle count is fixed after initial load to avoid geometry rebuild cost;
    // camera distance is nudged on very small screens so the M shape remains framed.
    if (window.innerWidth <= 480){
      camera.position.z = 340;
    } else if (window.innerWidth <= 900){
      camera.position.z = 300;
    } else {
      camera.position.z = 260;
    }
  });

  // initial camera framing based on starting width
  if (window.innerWidth <= 480) camera.position.z = 340;
  else if (window.innerWidth <= 900) camera.position.z = 300;
})();
</script>
